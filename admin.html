<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الأدمن | KEVIN GAME STORE</title>
<style>
:root{--bg:#080d1b;--panel:#121d34;--line:#293d62;--blue:#45a7ff;--muted:#adbbd3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7ff;font-family:Arial,Tahoma,sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px 14px 50px}h1{color:var(--blue)}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px;margin:15px 0}input,select,button{font:inherit;border-radius:9px;padding:11px;margin:5px 0}input,select{width:100%;background:#081226;border:1px solid #30466f;color:#fff}button{cursor:pointer;border:0;background:#218cff;color:#061226;font-weight:bold}.secondary{background:#33415e;color:#fff}.danger{background:#9b3248;color:#fff}.hidden{display:none}.muted{color:var(--muted);line-height:1.7}.order{border:1px solid #2b4168;border-radius:12px;padding:14px;margin:12px 0;background:#0b1428}.order h3{margin-top:0}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.status{font-weight:bold;color:#ffd166}.proof{color:#7dc6ff}.error{color:#ff9aab}.ok{color:#70e2b3}a{color:#7dc6ff}
</style></head><body><main class="wrap">
<h1>🔐 KEVIN GAME STORE — لوحة الأدمن</h1><p class="muted">تسجيل دخول Firebase مطلوب. لا تشارك حساب الأدمن أو كلمة مروره مع العملاء.</p>
<section id="loginCard" class="card"><h2>تسجيل الدخول</h2><form id="loginForm"><label>إيميل الأدمن</label><input id="email" type="email" autocomplete="username" required><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">دخول</button></form><p id="loginMsg" class="error"></p></section>
<section id="dashboard" class="hidden"><div class="card"><div class="row"><div><h2>الطلبات</h2><p id="who" class="muted"></p></div><div><button id="refreshBtn">تحديث القائمة</button> <button id="logoutBtn" class="secondary">تسجيل خروج</button></div></div><p class="muted">راجع إيصال الدفع من لوحة الأدمن وتأكد من وصول الأموال في حسابك قبل تغيير الحالة إلى «تم تأكيد الدفع» أو «مكتمل».</p><p id="dashMsg"></p></div><div id="orders"></div></section>
</main><script type="module" src="./admin.js"></script></body></html>
